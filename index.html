<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zufälliger Aufgabengenerator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .result-box {
            background-color: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .category {
            font-weight: bold;
            color: #555;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .task {
            font-size: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    
    
    <div class="result-box">
        <div id="category-display" class="category">Kategorie lädt...</div>
        <div id="task-display" class="task">Aufgabe lädt...</div>
    </div>
</div>

<script>
    const aufgabenPool = {
        "Niete": [
            "Mache 15 Liegestütze.",
            "Trinke ein großes Glas Wasser.",
            "Dehne dich für 5 Minuten.",
            "Mache 20 Kniebeugen."
        ],
        "Gewinn": [
            "Lies 10 Seiten in einem Buch.",
            "Räume deinen Schreibtisch für 5 Minuten auf.",
            "Lerne 5 neue Vokabeln.",
            "Schreibe deine To-Do-Liste für morgen."
        ]
    };

    function waehleZufaelligeAufgabe() {
        const kategorien = Object.keys(aufgabenPool);
        
        const zufaelligeKategorieIndex = Math.floor(Math.random() * kategorien.length);
        const ausgewaehlteKategorie = kategorien[zufaelligeKategorieIndex];
        
        const aufgabenAusKategorie = aufgabenPool[ausgewaehlteKategorie];
        
        const zufaelligeAufgabeIndex = Math.floor(Math.random() * aufgabenAusKategorie.length);
        const ausgewaehlteAufgabe = aufgabenAusKategorie[zufaelligeAufgabeIndex];
        
        const kategorieAnzeige = document.getElementById("category-display");
        const aufgabeAnzeige = document.getElementById("task-display");

        kategorieAnzeige.innerText = ausgewaehlteKategorie;
        aufgabeAnzeige.innerText = ausgewaehlteAufgabe;

        if (ausgewaehlteKategorie === "Niete") {
            aufgabeAnzeige.style.color = "#d9534f"; // Rot
        } else if (ausgewaehlteKategorie === "Gewinn") {
            aufgabeAnzeige.style.color = "#28a745"; // Grün
        }
    }

    // Die Funktion wird automatisch ausgeführt, sobald die Seite geöffnet wird
    window.onload = waehleZufaelligeAufgabe;
</script>

</body>
</html>
