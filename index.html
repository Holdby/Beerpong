<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 5px;
            background: #e9ecef;
            min-height: 80px;
            /* Sanfter Übergang beim Farbwechsel */
            transition: background-color 0.3s ease; 
        }
        .category {
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            color: #6c757d; /* Bleibt wie gewünscht immer grau */
            margin: 0 0 10px 0;
        }
        .task {
            font-size: 20px;
            margin-top: 10px;
            font-weight: bold;
        }
        .info {
            font-size: 12px;
            color: #6c757d;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ID hinzugefügt, um die Box über JavaScript anzusprechen -->
    <div id="resultBox" class="result-box">
        <h2 id="categoryDisplay" class="category">Lädt...</h2>
        <div id="taskDisplay" class="task">Bitte warten...</div>
    </div>

    <div class="info">
        
    </div>
</div>

<script>
    // 1. Kategorien definieren (Hintergrundfarben als 'bgColor' im Hex-Format hinzugefügt)
    const categories = [
        { id: "Niete", name: "💣 Niete 💣", weight: 0.585, color: "red", bgColor: "#ffe3e3" },
        { id: "Gewinn", name: "🍀 Gewinn 🍀", weight: 0.195, color: "green", bgColor: "#e3f9e5" },
        { id: "Neutral", name: "🍻 Neutral 🍻", weight: 0.2, color: "#696969", bgColor: "#ffffff" },
        { id: "Tod", name: "💀 Tod 💀", weight: 0.02, color: "black", bgColor: "#e2e2e2" }
    ];

    // 2. Aufgabenpools
    const tasks = {
        "Gewinn": [
            "Du darfst einen Extrawurf mit verschlossenen Augen machen",
            "Du darfst einen Extrawurf mit Rücken zum Tisch machen",
            "Stelle einen extra Becher zum gegnerischen Team",
	    "Du darfst einen Becher vom gegnerischen Team beliebig umstellen",
	    "Der Becher bleibt stehen und muss nicht getrunken werden",
	    "Entscheide ob die Seiten getauscht werden oder nicht",
	    "Der Becherinhalt darf in einen beliebigen Becher der Gegner gekippt werden",
	    "Granny-Shot: Die nächsten beiden Würfe des Gegnerteams müssen von unten nach oben erfolgen"

        ],
        "Niete": [
            "Das gegnerische Team darf einen Extrawurf mit verschlossenen Augen machen",
            "Die nächsten zwei Würfe müssen mit der schwachen Hand gemacht werden",
            "Setze die nächsten zwei Runden aus (nur ein Wurf fürs Team)",
	    "T-Rex-Wurf: Die Ellbogen müssen beim nächsten Wurf eng an den Körper gepresst bleiben",
	    "Der nächste Wurf muss im Sitzen (auf dem Boden) erfolgen",
	    "Der nächste Wurf muss eine Wand berühren",
	    "Trinke einen beliebigen Extra-Becher",
	    "Das Gegnerteam darf entscheiden ob die Seiten getauscht werden oder nicht"

        ],
        "Tod": [
            "Alle umliegenden Becher müssen auch getrunken werden",
            "Das gegnerische Team darf seine Becher komplett verteilen"
        ],

	"Neutral": [
            "Keine Aufgabe"
        ]

    };

    function generateTask() {
        const random = Math.random();
        
        let selectedCategory = null;
        let cumulativeWeight = 0;

        for (const cat of categories) {
            cumulativeWeight += cat.weight;
            if (random < cumulativeWeight) {
                selectedCategory = cat;
                break;
            }
        }

        const categoryTasks = tasks[selectedCategory.id];
        const randomTaskIndex = Math.floor(Math.random() * categoryTasks.length);
        const selectedTask = categoryTasks[randomTaskIndex];

        // Elemente abrufen
        const resultBox = document.getElementById("resultBox");
        const categoryDisplay = document.getElementById("categoryDisplay");
        const taskDisplay = document.getElementById("taskDisplay");

        // Inhalte und Stile dynamisch setzen
        categoryDisplay.innerText = selectedCategory.name;
        taskDisplay.innerText = selectedTask;
        taskDisplay.style.color = selectedCategory.color;
        
        // Ändert die Hintergrundfarbe der Box basierend auf der Kategorie
        resultBox.style.backgroundColor = selectedCategory.bgColor;
    }

    // Führt die Funktion sofort beim Laden der Seite aus
    window.onload = generateTask;
</script>

</body>
</html>
</body>
</html>
